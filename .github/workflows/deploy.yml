name: Deploy platform.getsqe.com

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install marketing site deps
        run: npm ci

      - name: Install docs deps
        working-directory: docs-site
        run: pnpm install --frozen-lockfile

      - name: Leak-gate self-tests
        run: bash scripts/leak-scan.test.sh

      # Builds both projects, composes dist/docs, and runs the BLOCKING
      # leak gate over the whole tree. Never split the gate out of this.
      - name: Build both sites + leak-scan gate
        run: bash scripts/build-with-docs.sh

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
